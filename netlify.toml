# Two modes, picked by which environment variables the Netlify site has:
#  - Dev/preview: set VITE_CONVEX_URL to your Convex dev URL. Netlify builds
#    the web app only. You push the backend yourself with `npx convex dev --once`.
#  - Production: set CONVEX_DEPLOY_KEY instead. Netlify deploys the Convex
#    production backend, then builds the web app pointed at it.
[build]
  command = "if [ -n \"$CONVEX_DEPLOY_KEY\" ]; then npx convex deploy --cmd 'npm run build'; else npm run build; fi"
  publish = "dist"

# Single-page app: every path serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Clerk loads its script from your Clerk domain and uses Cloudflare for bot checks.
    # If you move Clerk to a custom domain (clerk.yourdomain.com), add it to script-src and connect-src.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://*.clerk.accounts.dev https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.convex.cloud wss://*.convex.cloud https://*.convex.site https://*.clerk.accounts.dev https://clerk-telemetry.com; worker-src 'self' blob:; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
